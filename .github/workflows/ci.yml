name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    name: test (${{ matrix.nvim }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        nvim: [stable, nightly]
    steps:
      - uses: actions/checkout@v4

      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: ${{ matrix.nvim }}

      # Extra parsers widen coverage; the suites skip languages whose parser
      # is missing, so this must never fail the build.
      - name: Install extra Tree-sitter parsers
        continue-on-error: true
        run: |
          pack="$HOME/.local/share/nvim/site/pack/ci/start"
          mkdir -p "$pack"
          git clone --depth 1 --branch master \
            https://github.com/nvim-treesitter/nvim-treesitter "$pack/nvim-treesitter"
          nvim --headless -c "TSInstallSync python java javascript ruby bash" -c "qa!"

      - name: Core tests (no Neovim APIs)
        run: nvim -l tests/run_core.lua

      - name: Neovim tests
        run: nvim -l tests/run_nvim.lua

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: JohnnyMorganz/stylua-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: latest
          args: --check lua plugin tests

      - uses: leafo/gh-actions-lua@v10
        with:
          luaVersion: "5.1"
      - uses: leafo/gh-actions-luarocks@v4
      - run: luarocks install luacheck
      - run: luacheck lua plugin tests
